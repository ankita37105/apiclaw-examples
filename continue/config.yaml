name: APIClaw config
version: 1.0.0
schema: v1
models:
  - name: APIClaw
    provider: openai
    model: apiclaw/claude-sonnet-5.5
    apiBase: https://apiclaw.biz/v1
    apiKey: ${{ secrets.APICLAW_API_KEY }}
    capabilities:
      - tool_use
      - image_input
    roles:
      - chat
      - edit
